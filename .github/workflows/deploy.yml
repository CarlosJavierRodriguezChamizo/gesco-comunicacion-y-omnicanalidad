name: Publicar en GitHub Pages

# Construye con Vite y publica el contenido de /dist en la rama `gh-pages`
# en cada push a main.
#
# ¿Por qué a una rama y no con actions/deploy-pages? Porque deploy-pages exige
# que el origen de Pages esté fijado en "GitHub Actions", un ajuste del
# repositorio. Publicando en `gh-pages` basta con elegir esa rama una sola vez
# en Settings → Pages, y a partir de ahí cada push a main actualiza el sitio.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Un único despliegue a la vez; no cancela uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Sin .nojekyll, Pages pasa el sitio por Jekyll, que ignora todo lo que
      # empieza por guion bajo: tools/_styleguide.html desaparecería.
      - name: Marcar el sitio como estático (sin Jekyll)
        run: touch dist/.nojekyll

      - name: Publicar /dist en gh-pages
        run: |
          set -e
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar el sitio construido desde ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
